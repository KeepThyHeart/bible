<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech harness</title>
  <!--
    Dev-only page for the on-device speech engine (task 0151). It is not listed in
    `build.rollupOptions.input`, so `vite build` never sees it; `vite dev` serves it at
    /dev/speech.html. Nothing in the production entry chunk may import dev/ (see FORBIDDEN in
    scripts/check-entry-chunk.mjs).
  -->
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e6eb;
      --accent: #2f5fd0; --accent-ink: #ffffff; --ok: #18794e; --ok-bg: #e3f4ea;
      --warn: #9a6400; --warn-bg: #fdf1d8; --bad: #b42318; --bad-bg: #fde7e4; --track: #e9ecf1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161d; --card: #1a2029; --ink: #e7eaf0; --muted: #9aa4b5; --line: #2a3140;
        --accent: #6d95ff; --accent-ink: #0d1320; --ok: #5fd39a; --ok-bg: #173226;
        --warn: #f0b94d; --warn-bg: #3a2e14; --bad: #ff8b7e; --bad-bg: #3d1e1b; --track: #2a3140;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 2px; }
    h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .spread { justify-content: space-between; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 20px; margin: 0; }
    .grid dt { color: var(--muted); font-size: 12px; }
    .grid dd { margin: 0 0 2px; font-weight: 600; word-break: break-word; }
    button, select, input[type=text] { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip { border-radius: 999px; padding: 4px 12px; }
    .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .muted { color: var(--muted); }
    .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--track); color: var(--muted); }
    .pill.ok { background: var(--ok-bg); color: var(--ok); }
    .pill.bad { background: var(--bad-bg); color: var(--bad); }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; min-width: 140px; flex: 1; }
    .bar > i { display: block; height: 100%; background: var(--accent); transition: width .12s linear; }
    .meter > i { background: var(--ok); transition: width .05s linear; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
    th { border-top: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .passage { font-size: 18px; line-height: 1.9; margin: 12px 0 4px; }
    .passage { display: flex; flex-wrap: wrap; gap: 6px 2px; line-height: 1.6; }
    .w { padding: 1px 5px; margin-right: 2px; border-radius: 6px; }
    .w.correct, .w.variant { background: var(--ok-bg); color: var(--ok); }
    .w.near, .w.hinted, .w.swapped { background: var(--warn-bg); color: var(--warn); }
    .w.wrong, .w.missed { background: var(--bad-bg); color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
    .w .said { font-style: italic; opacity: .85; }
    .w .tag { font-size: .8em; font-weight: 600; }
    .popup-backdrop { position: fixed; inset: 0; background: #0006; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .popup { max-width: 560px; width: calc(100% - 32px); max-height: 80vh; overflow: auto; }
    .score { font-size: 28px; font-weight: 700; }
    pre { margin: 8px 0 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 260px; font-size: 12px; }
    .err { color: var(--bad); }
    label.sw { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/dev/speech/main.tsx"></script>
</body>
</html>
